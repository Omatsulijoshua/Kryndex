envVarGroups:
  - name: kryndex-shared-env
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_PASSWORD
        value: "" # Render Redis runs passwordless internally
      - key: DATABASE_URL
        sync: false

services:
  # Redis Cache instance
  - type: redis
    name: kryndex-redis
    plan: free
    ipAllowList: [] # internal access only

  # Combined Backend Web Service (Runs Gateway + all microservices internally)
  - type: web
    name: kryndex-backend
    env: node
    plan: free
    buildCommand: pnpm install && node -e "if (process.env.DATABASE_URL && (process.env.DATABASE_URL.startsWith('postgres://') || process.env.DATABASE_URL.startsWith('postgresql://'))) { require('child_process').execSync('pnpm --filter @kryndex/database db:push', {stdio: 'inherit'}); } else { console.log('WARNING: DATABASE_URL is not a valid Postgres connection string. Skipping database schema sync during build.'); }" && pnpm build
    startCommand: node scripts/start-production.js
    envVars:
      - fromGroup: kryndex-shared-env
      - key: REDIS_HOST
        fromService:
          type: redis
          name: kryndex-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: kryndex-redis
          property: port
