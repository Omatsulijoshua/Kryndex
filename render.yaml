databases:
  - name: kryndex-db
    databaseName: kryndex_exchange
    user: kryndex_db_user
    plan: free

envVarGroups:
  - name: kryndex-shared-env
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_PASSWORD
        value: "" # Render Redis runs passwordless internally

services:
  # Redis Cache instance
  - type: redis
    name: kryndex-redis
    plan: free
    ipAllowList: [] # internal access only

  # 1. Auth Service (Private)
  - type: pserv
    name: auth-service
    env: node
    plan: free
    buildCommand: pnpm install && pnpm --filter @kryndex/database build && pnpm --filter auth-service build
    startCommand: node services/auth-service/dist/main.js
    envVars:
      - fromGroup: kryndex-shared-env
      - key: DATABASE_URL
        fromDatabase:
          name: kryndex-db
          property: connectionString
      - key: PORT
        value: 3001

  # 2. Trade Service (Private)
  - type: pserv
    name: trade-service
    env: node
    plan: free
    buildCommand: pnpm install && pnpm --filter @kryndex/database build && pnpm --filter trade-service build
    startCommand: node services/trade-service/dist/main.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kryndex-db
          property: connectionString
      - key: PORT
        value: 3002
      - key: REDIS_HOST
        fromService:
          type: redis
          name: kryndex-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: kryndex-redis
          property: port

  # 3. Wallet Service (Private)
  - type: pserv
    name: wallet-service
    env: node
    plan: free
    buildCommand: pnpm install && pnpm --filter @kryndex/database build && pnpm --filter wallet-service build
    startCommand: node services/wallet-service/dist/main.js
    envVars:
      - fromGroup: kryndex-shared-env
      - key: DATABASE_URL
        fromDatabase:
          name: kryndex-db
          property: connectionString
      - key: PORT
        value: 3003
      - key: REDIS_HOST
        fromService:
          type: redis
          name: kryndex-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: kryndex-redis
          property: port

  # 4. WebSocket Service (Public)
  - type: web
    name: websocket-service
    env: node
    plan: free
    buildCommand: pnpm install && pnpm --filter @kryndex/database build && pnpm --filter websocket-service build
    startCommand: node services/websocket-service/dist/main.js
    envVars:
      - fromGroup: kryndex-shared-env
      - key: DATABASE_URL
        fromDatabase:
          name: kryndex-db
          property: connectionString
      - key: PORT
        value: 3004
      - key: REDIS_HOST
        fromService:
          type: redis
          name: kryndex-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: kryndex-redis
          property: port

  # 5. API Gateway (Public Web service)
  - type: web
    name: api-gateway
    env: node
    plan: free
    buildCommand: pnpm install && pnpm --filter @kryndex/database build && pnpm --filter api-gateway build
    startCommand: node services/api-gateway/dist/main.js
    envVars:
      - key: PORT
        value: 3000
      - key: AUTH_SERVICE_URL
        value: http://auth-service:3001
      - key: TRADE_SERVICE_URL
        value: http://trade-service:3002
      - key: WALLET_SERVICE_URL
        value: http://wallet-service:3003
