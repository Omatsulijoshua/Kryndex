databases:
  - name: kryndex-db
    databaseName: kryndex_exchange
    user: kryndex_db_user
    plan: free

envVarGroups:
  - name: kryndex-shared-env
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_PASSWORD
        value: "" # Render Redis runs passwordless internally

services:
  # Redis Cache instance
  - type: redis
    name: kryndex-redis
    plan: free
    ipAllowList: [] # internal access only

  # Combined Backend Web Service (Runs Gateway + all microservices internally)
  - type: web
    name: kryndex-backend
    env: node
    plan: free
    buildCommand: pnpm install && pnpm build
    startCommand: node scripts/start-production.js
    envVars:
      - fromGroup: kryndex-shared-env
      - key: DATABASE_URL
        fromDatabase:
          name: kryndex-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: kryndex-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: kryndex-redis
          property: port
